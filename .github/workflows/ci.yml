name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:

env:
  VITE_API_BASE_URL: /api/v1
  VITE_RBAC_UI_ENFORCE_PERMISSIONS: "true"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: |
          if [ ! -s package-lock.json ]; then
            echo "::error::package-lock.json is missing or empty. Run npm install and commit package-lock.json"
            exit 1
          fi
          npm ci

      - name: Typecheck and production build
        run: npm run build

      - name: Unit tests
        run: npm test

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    steps:
      - name: SSH deploy (staging)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.STAGING_DEPLOY_HOST }}
          username: ${{ secrets.STAGING_DEPLOY_USER }}
          key: ${{ secrets.STAGING_DEPLOY_SSH_KEY }}
          port: ${{ secrets.STAGING_DEPLOY_PORT }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "$HOME/university-mgt-system-frontend"
            git fetch origin
            git checkout staging
            git pull --ff-only origin staging
            npm ci
            npm run build
            rsync -a --delete dist/ /var/www/kcu-mgt-frontend/

  deploy-production:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: SSH deploy (production)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "$HOME/university-mgt-system-frontend"
            git fetch origin
            git checkout "${{ github.ref_name }}"
            git pull --ff-only origin "${{ github.ref_name }}"
            npm ci
            npm run build
            rsync -a --delete dist/ /var/www/kcu-mgt-frontend/
